services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myturn
    # Host port 5433 avoids Windows Postgres (often on 5432) stealing connections.
    ports:
      - "5433:5432"
    volumes:
      - myturn_pg:/var/lib/postgresql/data

volumes:
  myturn_pg:
