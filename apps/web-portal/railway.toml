[build]
builder = "NIXPACKS"
buildCommand = "npm run build:shared && npm run build -w @myturn/api-client && npm run build --workspace=web-portal"

[deploy]
startCommand = "npm run start --workspace=web-portal"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
