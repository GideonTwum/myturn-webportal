[build]
builder = "NIXPACKS"
buildCommand = "npm run build:shared && npm run build -w backend-api"

[deploy]
preDeployCommand = "npx prisma migrate deploy --schema=services/backend-api/prisma/schema.prisma"
startCommand = "node services/backend-api/dist/main.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
